name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ai/pyproject.toml
            ai/requirements-serve.lock
      - name: Install development dependencies
        run: python -m pip install -c ai/requirements-serve.lock -e "./ai[pipeline,quality,serve,serve-test]"
      - name: Verify tests, package, C++ kernels, and repository
        run: python scripts/verify.py

  research:
    name: Public experiment reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      - run: python -m pip install -e "./ai[pipeline]"
      - name: Reproduce OLR and compare published predictions
        run: python scripts/reproduce.py --output "${{ runner.temp }}/synthetic-run"
      - name: Recompute all published comparison metrics
        run: python scripts/check_published_metrics.py

  cpp:
    name: CMake / CTest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S firmware -B build/firmware -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/firmware
      - run: ctest --test-dir build/firmware --output-on-failure

  container:
    name: Packaged AI service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated model service
        run: docker build -t ostosense-ai-smoke .
      - name: Probe four classes over loopback
        env:
          OSTOSENSE_SERVICE_TOKEN: ci-fixture-only-not-a-production-credential
        run: |
          set -euo pipefail
          docker run -d --name ai-smoke -p 127.0.0.1:8000:8000 \
            -e OSTOSENSE_SERVICE_TOKEN -e OSTOSENSE_ALLOW_TEST=true ostosense-ai-smoke
          trap 'docker stop ai-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/probe_ai_service.py
