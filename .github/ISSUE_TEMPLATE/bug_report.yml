name: Bug report
description: Report a reproducible problem with the pipeline, service, or tooling.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands and a minimal synthetic input. Do not attach private recordings or credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, Python version, installed extras, and compiler if relevant.
    validations:
      required: true
