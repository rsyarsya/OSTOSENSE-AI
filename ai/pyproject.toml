[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ostosense-contract"
version = "0.2.0"
description = "OSTOSENSE data contracts, engineering model, offline pipeline, and experimental AI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serve = ["fastapi==0.141.1", "uvicorn==0.52.4"]
serve-test = ["httpx==0.28.1"]
pipeline = [
    "matplotlib==3.11.1",
    "mord==0.7",
    "numpy==2.2.6",
    "scikit-learn==1.9.0",
    "scipy==1.14.1",
]
quality = [
    "build==1.6.0",
    "jsonschema==4.26.0",
    "pyright==1.1.411",
    "ruff==0.16.5",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["build"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ostosense_ai = ["model_assets/engineering_v03/*.json", "model_assets/engineering_v03/*.md"]
